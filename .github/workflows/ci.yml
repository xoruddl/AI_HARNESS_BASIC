# 규칙: docs/lint-and-ci.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 커밋 규칙(파일 수, 메시지 형식)은 CI 에서 막지 않는다. 로컬 훅만 검사한다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 지침 전용 저장소일 때는 Gradle 프로젝트가 없으므로 빌드를 건너뛴다.
      - name: Gradle 프로젝트 확인
        id: detect
        run: |
          if [ -f gradlew ]; then echo "gradle=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v6
        if: steps.detect.outputs.gradle == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: steps.detect.outputs.gradle == 'true'

      - name: 포맷 검사 + 빌드
        if: steps.detect.outputs.gradle == 'true'
        run: ./gradlew spotlessCheck build
